name: Deploy Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ false }} # local RC: deployment intentionally disabled until ZIP verification is complete
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      INTEGRATION_KEY: ${{ secrets.INTEGRATION_KEY }}
      MCP_OAUTH_SECRETS: ${{ secrets.MCP_OAUTH_SECRETS }}
      MCP_SERVERS: ${{ vars.MCP_SERVERS }}
      AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID || 'default' }}
      DAILY_PROVIDER_CALLS: ${{ vars.DAILY_PROVIDER_CALLS || '200' }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
      OPERATOR_ACCOUNT_IDS: ${{ vars.OPERATOR_ACCOUNT_IDS }}
      AZRAIL_TARGET_ENV: production
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run deploy:ci
