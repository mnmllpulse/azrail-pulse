name: Deploy Cloudflare Staging
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-staging-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dependency:audit
      - run: npm run source:manifest:check
      - run: npm run repo:exhaustive
      - run: npm run repo:hygiene
      - run: npm run quality:static
      - run: npm run node24:suite
  deploy_staging:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      INTEGRATION_KEY: ${{ secrets.INTEGRATION_KEY }}
      MCP_OAUTH_SECRETS: ${{ secrets.MCP_OAUTH_SECRETS }}
      MCP_SERVERS: ${{ vars.MCP_SERVERS }}
      AZRAIL_TARGET_ENV: staging
      AZRAIL_ALLOW_CLOUD_MUTATION: I_UNDERSTAND
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run deploy:ci
      - run: npm run staging:auto-health
